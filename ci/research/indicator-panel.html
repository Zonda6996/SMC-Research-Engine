			<!-- Независимые индикаторы -->
			<section class="section" id="indicatorPanel">
				<div class="section-head"><h2>Индикаторы <span class="ver">TV-style</span></h2><span class="chevron"></span></div>
				<div class="section-body indicator-settings">
					<div class="indicator-switches"><label class="check" id="apexChkWrap"><input type="checkbox" id="apexChk" checked /> Zonda Apex</label><label class="check" id="reversalChkWrap"><input type="checkbox" id="reversalChk" checked /> Zonda Reversal</label></div>
					<details open><summary>Zonda Apex · Inputs</summary><div class="indicator-body"><div class="indicator-grid">
						<label class="indicator-field">Источник<select class="input" id="apexSource"><option value="hlc3">(H+L+C)/3</option><option value="close">Close</option><option value="hl2">(H+L)/2</option><option value="ohlc4">OHLC/4</option></select></label>
						<label class="indicator-field">Lookback<input class="input" id="apexLookback" type="number" min="20" max="1000" value="200" /></label><label class="indicator-field">Inner multiplier<input class="input" id="apexKInner" type="number" step="0.1" value="5.6" /></label><label class="indicator-field">Outer amplitude<input class="input" id="apexKOuter" type="number" step="0.1" value="9.6" /></label>
					</div></div></details>
					<details><summary>Zonda Apex · Style</summary><div class="indicator-body style-list">
						<label class="style-row"><input type="checkbox" id="meanOn" checked><span>Mean</span><input class="style-width" type="number" id="meanWidth" min="1" max="4" value="2" title="Толщина"><input type="color" id="meanColor" value="#4f83ff"></label>
						<label class="style-row"><input type="checkbox" id="redLoOn" checked><span>Upper inner</span><input class="style-width" type="number" id="redLoWidth" min="1" max="4" value="1"><input type="color" id="redLoColor" value="#f4506a"></label><label class="style-row"><input type="checkbox" id="redHiOn" checked><span>Upper outer</span><input class="style-width" type="number" id="redHiWidth" min="1" max="4" value="1"><input type="color" id="redHiColor" value="#f4506a"></label>
						<label class="style-row"><input type="checkbox" id="greenHiOn" checked><span>Lower inner</span><input class="style-width" type="number" id="greenHiWidth" min="1" max="4" value="1"><input type="color" id="greenHiColor" value="#2fd08c"></label><label class="style-row"><input type="checkbox" id="greenLoOn" checked><span>Lower outer</span><input class="style-width" type="number" id="greenLoWidth" min="1" max="4" value="1"><input type="color" id="greenLoColor" value="#2fd08c"></label>
						<label class="style-row"><input type="checkbox" id="upperFillOn" checked><span>Upper fill</span><input type="color" id="upperFillColor" value="#f4506a"></label><label class="style-row"><input type="checkbox" id="lowerFillOn" checked><span>Lower fill</span><input type="color" id="lowerFillColor" value="#2fd08c"></label><label class="check"><input type="checkbox" id="priceLabels" checked> Метки на шкале</label>
					</div></details>
					<details><summary>Zonda Reversal · Inputs & Style</summary><div class="indicator-body"><div class="indicator-grid"><label class="indicator-field">Режим<select class="input" id="riskMode"><option value="safe">Safe</option><option value="standard" selected>Standard</option><option value="risk">Risk</option></select></label></div><div class="style-list"><label class="style-row"><input type="checkbox" id="buyOn" checked><span>BUY</span><input type="color" id="buyColor" value="#2fd08c"></label><label class="style-row"><input type="checkbox" id="sellOn" checked><span>SELL</span><input type="color" id="sellColor" value="#f4506a"></label></div><p class="indicator-note">Safe / Standard / Risk сохранён для отдельной калибровки. Сейчас режим честно не меняет триггер.</p></div></details>
					<div class="btn-row"><button class="btn btn-primary sm" id="indicatorApply">Применить и пересчитать</button><button class="btn btn-ghost sm" id="indicatorReset">Сбросить к канону</button></div>
				</div>
			</section>
